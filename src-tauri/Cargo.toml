[package]
name = "ponto"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Standalone workspace: not a member of the root workspace (paid-core/admin)
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ponto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sharekit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.0.1", features = ["sqlite"] }
chrono = { version = "0.4.44", features = ["serde"] }
rust_xlsxwriter = { version = "0.95.0", features = ["chrono"] }
async-trait = "0.1.89"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "chrono"] }
paid-core = { path = "../paid-core" }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }


[package]
name = "paid-core"
version = "0.1.0"
edition = "2021"
description = "Signed payment file format shared by the Ponto app (verify) and the admin tool (sign)"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
